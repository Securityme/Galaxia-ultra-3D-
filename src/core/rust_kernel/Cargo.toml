[package]
name = "bio_dome_sim_kernel"
version = "4.0.0"
edition = "2021"
authors = ["GALAXIA ULTRA Engineering"]
description = "PT-74 Canonical Simulation Engine compiled to WebAssembly for Bio-Dôme de Poche"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
